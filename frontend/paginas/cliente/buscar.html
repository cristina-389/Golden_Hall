<!--
  GOLDEN HALL - PÁGINA DE BUSCA (paginas/cliente/buscar.html)
  Tela de busca/filtro de espaços. Os espaços vêm de verdade da API
  (GET /api/espacos) - buscar.js busca a lista assim que a página carrega
  e desenha os cards dinamicamente. O botão de coração de cada card usa as
  funções de favoritos que ficam em js/global.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hall | Buscar Espaços</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!--icones dourados-->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="stylesheet" href="/frontend/css/paginas/buscar.css">
</head>
<body class="logado-layout dark">

    <main class="page-content">

        <section class="central-busca">
            <h2>Encontre o espaço perfeito para <span class="gold-text">seu evento</span></h2>

            <div class="linha-elegante">
                <span>✦</span>
            </div>

            <p class="section-subtitle">Descreva o espaço que você procura</p>

            <div class="busca-container-box">
                <div class="busca-linha-principal">
                    <i class="bi bi-search icone-busca"></i>
                    <input type="text" id="input-busca" placeholder="Ex:: Espaço para casamento em Americana para 300 pessoas">
                    <i class="bi bi-x-lg icone-limpar" onclick="document.getElementById('input-busca').value=''"></i>
                </div>
            </div>

            <button class="btn-buscar-principal" onclick="filtrarEspacos()">
                <i class="bi bi-search"></i> Buscar espaços
            </button>

            <div class="filtros-trigger" onclick="toggleFiltros()">
                <i class="bi bi-gear" id="gear-icon"></i> Filtros avançados <i class="bi bi-chevron-down" id="chevron-icon"></i>
            </div>

            <!-- Painel de filtros: começa fechado (max-height: 0 no CSS) e abre/fecha
                 via toggleFiltros(), que alterna a classe "ativo" -->
            <div class="painel-filtros-avancados" id="painelFiltros">
                <div class="filtros-grid-inputs">
                    
                    <div class="campo-filtro">
                        <label>Cidade</label>
                        <div class="input-wrapper">
                            <i class="bi bi-geo-alt"></i>
                            <input type="text" id="filtro-cidade" placeholder="Digite a cidade...">
                        </div>
                    </div>

                    <div class="campo-filtro">
                        <label>Tipo de evento</label>
                        <div class="input-wrapper">
                            <i class="bi bi-calendar4-event"></i>
                            <input type="text" id="filtro-evento" placeholder="Ex: Casamento, Festa...">
                        </div>
                    </div>

                    <div class="campo-filtro">
                        <label>Capacidade</label>
                        <div class="input-wrapper">
                            <i class="bi bi-people"></i>
                            <input type="number" id="filtro-capacidade" placeholder="Qtd. de pessoas...">
                        </div>
                    </div>

                    <div class="campo-filtro">
                        <label>Faixa de preço máximo</label>
                        <div class="input-wrapper">
                            <i class="bi bi-currency-dollar"></i>
                            <input type="number" id="filtro-preco" placeholder="Valor máximo (R$)...">
                        </div>
                    </div>

                </div>

                <div class="painel-filtros-botoes">
                    <button class="btn-limpar-filtros" onclick="limparFiltros()">Limpar filtros</button>
                    <button class="btn-aplicar-filtros" onclick="filtrarEspacos()">Aplicar filtros</button>
                </div>
            </div>
        </section>

        <!-- Esta seção e a de resultados abaixo ficam escondidas (display:none no
             CSS) até a pessoa clicar em "Buscar espaços" - é o filtrarEspacos()
             que mostra as duas e atualiza o número de "espaços encontrados" -->
        <section class="barra-resultados-info">
            <div class="resultados-texto">
                <span id="contador-cards">2</span> espaços encontrados
            </div>
        </section>

        <section class="resultados-busca">
            <!-- Preenchida via JS (renderizarCards(), em buscar.js) com um card
                 pra cada espaço que bate com a busca/filtro -->
            <div class="cards"></div>
        </section>

        <section class="alerta-busca-vazia" id="alerta-vazio" style="display: none;">
            <div class="alerta-vazio-container">
                <div class="alerta-vazio-icone">
                    <i class="bi bi-search"></i>
                </div>
                <div class="alerta-vazio-texto">
                    <h3>Não encontrou o que procura?</h3>
                    <p>Tente alterar alguns filtros ou faça uma nova busca.</p>
                </div>
                <button class="btn-nova-busca" onclick="limparFiltrosEComecar()">Nova busca</button>
            </div>
        </section>
    </main>

    <nav class="barra-navegacao-inferior">
        <a href="/frontend/paginas/cliente/index-logado.html" class="item-nav">
            <span class="material-icons-round icone">home</span>
            <span class="texto">Início</span>
        </a>
        <a href="/frontend/paginas/cliente/buscar.html" class="item-nav ativo">
            <span class="material-icons-round icone">search</span>
            <span class="texto">Buscar</span>
        </a>
        <a href="/frontend/paginas/cliente/favoritos.html" class="item-nav">
            <span class="material-icons-round icone">favorite</span>
            <span class="texto">Favoritos</span>
        </a>
        <a href="/frontend/paginas/cliente/reservas.html" class="item-nav">
            <span class="material-icons-round icone">calendar_month</span>
            <span class="texto">Reservas</span>
        </a>
        <a href="/frontend/paginas/cliente/perfil.html" class="item-nav">
            <span class="material-icons-round icone">person</span>
            <span class="texto">Perfil</span>
        </a>
    </nav>

    <script src="/frontend/js/global.js"></script>
    <script src="/frontend/js/paginas/buscar.js"></script>
</body>
</html>
