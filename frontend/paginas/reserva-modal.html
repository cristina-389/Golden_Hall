<div id="modal-reserva" class="modal-overlay">
    <div class="modal-box">
      <button class="fechar-modal" onclick="fecharModalReserva()">&times;</button>
  
      <h2>Solicitar Reserva</h2>
      <div class="linha-dourada-form"></div>
      <p class="subtitulo-form">Preencha os dados do evento para agendar este espaço.</p>
  
      <form action="#" method="POST" id="form-reserva" onsubmit="salvarReserva(event)">
        <div class="form-grid">
          
          <div class="input-grupo col-metade">
            <label for="reserva-data">Data do Evento</label>
            <div class="input-com-icone">
              <input type="date" id="reserva-data" required>
              <button type="button" class="btn-icone-agenda" onclick="abrirModalAgenda()" title="Ver calendário">
                <i class="bi bi-calendar3"></i>
              </button>
            </div>
          </div>
  
          <div class="input-grupo col-metade">
            <label for="reserva-tipo">Tipo de Evento</label>
            <select id="reserva-tipo" required>
              <option value="">Selecione...</option>
              <option value="Casamento">Casamento</option>
              <option value="Aniversário">Aniversário</option>
              <option value="Corporativo">Corporativo</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
  
          <div class="input-grupo col-metade">
            <label for="reserva-horario">Horário de Início</label>
            <input type="time" id="reserva-horario" required>
          </div>
  
          <div class="input-grupo col-metade">
            <label for="reserva-convidados">Nº de Convidados</label>
            <input type="number" id="reserva-convidados" placeholder="Ex: 150" min="10" required>
          </div>
  
          <div class="input-grupo col-total">
            <label for="reserva-telefone">Telefone / WhatsApp</label>
            <input type="tel" id="reserva-telefone" placeholder="(11) 99999-9999" required>
          </div>
  
          <div class="input-grupo col-total">
            <label for="reserva-obs">Observações (Opcional)</label>
            <textarea id="reserva-obs" rows="3" placeholder="Ex: Acesso antecipado para decoração..."></textarea>
          </div>

          <button type="submit" class="btn btn-gold btn-bloco">Confirmar Solicitação</button>
        </div>
      </form>
    </div>
  </div>
