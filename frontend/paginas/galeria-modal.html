<!--
  GOLDEN HALL - FRAGMENTO DO MODAL DE GALERIA DE FOTOS
  Carregado via fetch() por abrirModalGaleria() (js/modais.js) e injetado em
  #container-modal-galeria, nas páginas de detalhes. A foto grande
  (#foto-galeria-atual), o contador (#contador-galeria) e as miniaturas
  (#miniaturas-galeria) são preenchidos pela função gerarGaleria(), em
  js/paginas/detalhes.js, que usa o objeto bancoFotos (uma lista de fotos
  por espaço, igual ao bancoAvaliacoes já usado pro carrossel de avaliações).
-->
<div id="modal-galeria" class="modal-overlay">
    <div class="modal-box modal-galeria-box">
        <button class="fechar-modal" onclick="fecharModalGaleria()">&times;</button>

        <h2>Fotos do Espaço</h2>
        <div class="linha-dourada-form"></div>

        <div class="galeria-foto-grande">
            <button type="button" class="seta" onclick="fotoAnterior()">❮</button>
            <img id="foto-galeria-atual" src="" alt="Foto do espaço">
            <button type="button" class="seta" onclick="proximaFoto()">❯</button>
        </div>

        <p class="contador-galeria" id="contador-galeria">1 / 1</p>

        <!-- Preenchida via JS: uma miniatura clicável para cada foto do espaço -->
        <div class="miniaturas-galeria" id="miniaturas-galeria"></div>
    </div>
</div>
