<!--
  GOLDEN HALL - FRAGMENTO DO MODAL DE CADASTRO
  Este arquivo NÃO é uma página completa (sem <html>/<head>/<body>) - é só
  um pedaço de HTML que a função abrirModal() (em js/modais.js) busca com
  fetch() e injeta dentro da div #container-modal-cadastro de qualquer
  página que precise dele. O submit do formulário é tratado por
  adicionarValidacaoSenha() no mesmo modais.js.
-->
<div id="modal-cadastro" class="modal-overlay">
    <div class="modal-box">
        <button class="fechar-modal" onclick="fecharModal()">&times;</button>
        
        <h2>Criar sua Conta</h2>
        <div class="linha-dourada-form"></div>
        <p class="subtitulo-form">Preencha os campos para acessar o painel exclusivo.</p>
        
        <form action="#" method="POST" id="form-cadastro">
            <div class="form-grid">
                
                <div class="input-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="input-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@gmail.com" required>
                </div>

                <div class="input-grupo col-total"> <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                </div>

                <!-- Decide se a conta é de quem RESERVA espaços ou de quem ANUNCIA
                     um espaço - ver adicionarValidacaoSenha() em modais.js, que lê
                     esse valor e manda como "tipo" pra API. Não é mais um campo
                     visível: a pessoa já escolheu isso no modal anterior ("Como você
                     quer usar o Golden Hall?" - ver tipo-conta-modal.html), então
                     abrirModal(tipo) já chega aqui preenchendo esse campo escondido -
                     perguntar nos dois modais seria repetir a mesma pergunta duas vezes. -->
                <input type="hidden" id="cadastro-tipo-conta" name="tipo" value="cliente">

                <div class="input-grupo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" name="senha" placeholder="••••••••" minlength="6" required>
                        <button type="button" class="btn-mostrar-senha" onclick="alternarVisibilidadeSenha('senha', this)" title="Mostrar senha">
                            <span class="material-icons-round">visibility</span>
                        </button>
                    </div>
                    <small class="dica-campo">Mínimo de 6 caracteres</small>
                </div>

                <div class="input-grupo">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••" required>
                        <button type="button" class="btn-mostrar-senha" onclick="alternarVisibilidadeSenha('confirmar-senha', this)" title="Mostrar senha">
                            <span class="material-icons-round">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="checkbox-grupo">
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Aceito os Termos e Políticas do Golden Hall</label>
                </div>

                <button type="submit" class="btn btn-gold btn-bloco">Cadastrar</button>
            </div>
        </form>

        <p class="alternativa-form">
            Já tem uma conta? <a href="#" onclick="alternarParaLogin()">Faça login aqui</a>
        </p>
    </div>
</div>
