<!--
  GOLDEN HALL - SOLICITAÇÕES DE RESERVA DO DONO (paginas/dono/reservas-dono.html)
  Página exclusiva pra contas "proprietario" (ver js/paginas/reservas-dono.js,
  que bloqueia o acesso de quem não for). Um card comprido por espaço
  cadastrado - clicar em "Ver solicitações de reserva" abre a lista de
  pedidos daquele espaço, com Aprovar/Recusar. O botão "Ver avaliações" leva
  pra uma página separada com os comentários dos espaços.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hall | Reservas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/frontend/css/style.css">
    <!-- reservas.css continua importado só pelo ".card-reserva" usado no modal
         de solicitações (mesma ideia de painel-dono.html) -->
    <link rel="stylesheet" href="/frontend/css/paginas/reservas.css">
    <link rel="stylesheet" href="/frontend/css/paginas/painel-dono.css">
    <link rel="stylesheet" href="/frontend/css/paginas/reservas-dono.css">
</head>
<body class="dark home-logado-premium">

    <!-- ================= TÍTULO ================= -->
    <section class="secao-saudacao">
        <div class="secao-saudacao-topo">
            <div class="icone-contorno">
                <i class="bi bi-envelope-paper-fill"></i>
            </div>
            <h2>Solicitações de <span class="titulo-painel-dourado">Reserva</span></h2>
        </div>
        <div class="linha-elegante"><span>✦</span></div>
    </section>

    <!-- ================= RESUMO DAS RESERVAS ================= -->
    <!-- Números de verdade (GET /api/estatisticas-dono) - ver
         carregarResumoReservas() em reservas-dono.js. Mesmo estilo de card
         usado em "Minhas Reservas" do cliente (.estatisticas-grid, de
         reservas.css). -->
    <section class="secao-lista-espacos-dono">
        <div class="estatisticas-grid">
            <div class="card-estatistica">
                <div class="icone-estatistica pendente"><i class="bi bi-hourglass-split"></i></div>
                <div class="info-estatistica">
                    <span class="label">Reservas pendentes</span>
                    <h4 id="stat-pendentes-geral">0</h4>
                </div>
            </div>
            <div class="card-estatistica">
                <div class="icone-estatistica aprovado"><i class="bi bi-check-circle"></i></div>
                <div class="info-estatistica">
                    <span class="label">Reservas realizadas</span>
                    <h4 id="stat-reservas-realizadas">0</h4>
                </div>
            </div>
            <div class="card-estatistica">
                <div class="icone-estatistica"><i class="bi bi-star-fill"></i></div>
                <div class="info-estatistica">
                    <span class="label">Avaliações recebidas</span>
                    <h4 id="stat-total-avaliacoes">0</h4>
                </div>
            </div>
            <div class="card-estatistica">
                <div class="icone-estatistica aprovado"><i class="bi bi-calendar-heart-fill"></i></div>
                <div class="info-estatistica info-estatistica-texto">
                    <span class="label">Próxima reserva confirmada</span>
                    <h4 id="stat-proxima-reserva">-</h4>
                </div>
            </div>
        </div>
    </section>

    <!-- ================= LISTA DE ESPAÇOS ================= -->
    <section class="secao-lista-espacos-dono">
        <div class="secao-titulo-grid">
            <h3>Meus espaços</h3>
            <div class="botoes-topo-reservas">
                <button class="btn-ajuste btn-ver-avaliacoes" onclick="abrirEscolhaAvaliacoes()">
                    <i class="bi bi-star-fill"></i> Ver avaliações
                </button>
                <button class="btn-ajuste btn-ver-historico" onclick="abrirEscolhaHistorico()">
                    <i class="bi bi-clock-history"></i> Ver histórico
                </button>
            </div>
        </div>

        <!-- Preenchida via JS (carregarEspacosComReservas(), em reservas-dono.js) -->
        <div id="lista-espacos-reservas" class="lista-espacos-reservas"></div>
    </section>

    <nav class="barra-navegacao-inferior">
        <a href="/frontend/paginas/dono/index-logado-dono.html" class="item-nav">
            <i class="bi bi-house-door-fill icone"></i>
            <span class="texto">Início</span>
        </a>
        <a href="/frontend/paginas/dono/painel-dono.html" class="item-nav">
            <i class="bi bi-shop icone"></i>
            <span class="texto">Meus Espaços</span>
        </a>
        <a href="/frontend/paginas/dono/reservas-dono.html" class="item-nav ativo">
            <i class="bi bi-envelope-paper-fill icone"></i>
            <span class="texto">Reservas</span>
        </a>
        <a href="/frontend/paginas/dono/perfil-dono.html" class="item-nav">
            <i class="bi bi-person-fill icone"></i>
            <span class="texto">Perfil</span>
        </a>
    </nav>

    <!-- ================= MODAL: SOLICITAÇÕES DE RESERVA DE UM ESPAÇO ================= -->
    <div id="modal-reservas-espaco" class="modal-overlay">
        <div class="modal-box modal-reservas-espaco-box">
            <button class="fechar-modal" onclick="fecharReservasEspaco()">&times;</button>

            <h2 id="titulo-reservas-espaco">Reservas Recebidas</h2>
            <div class="linha-dourada-form"></div>

            <!-- Preenchida via JS (abrirReservasEspaco(), em reservas-dono.js) -->
            <div id="lista-reservas-espaco"></div>
        </div>
    </div>

    <!-- ================= MODAL: ESCOLHER ESPAÇO (avaliações OU histórico) =================
         Reaproveitado pelos dois botões acima - só aparece quando o dono tem
         mais de 1 espaço cadastrado (com só 1, já manda direto pra página
         certa - ver abrirEscolhaEspaco() em reservas-dono.js) -->
    <div id="modal-escolher-espaco" class="modal-overlay">
        <div class="modal-box">
            <button class="fechar-modal" onclick="fecharEscolhaEspaco()">&times;</button>

            <h2 id="titulo-escolher-espaco">Escolha um espaço</h2>
            <div class="linha-dourada-form"></div>

            <div id="lista-escolher-espaco" class="lista-escolher-espaco-avaliacoes"></div>
        </div>
    </div>

    <!-- ================= MODAL: MOTIVO DA RECUSA/CANCELAMENTO =================
         Aberto ao clicar em "Recusar" (reserva Pendente) ou "Cancelar
         reserva" (já Aprovada) - ver abrirModalMotivoRecusa() em
         reservas-dono.js. O texto escrito aqui fica salvo em
         "motivo_recusa" e o cliente vê ele em "Minhas Reservas". -->
    <div id="modal-motivo-recusa" class="modal-overlay">
        <div class="modal-box">
            <button class="fechar-modal" onclick="fecharModalMotivoRecusa()">&times;</button>

            <h2>Motivo da recusa</h2>
            <div class="linha-dourada-form"></div>
            <p class="subtitulo-form" id="aviso-motivo-recusa"></p>

            <form id="form-motivo-recusa" onsubmit="return confirmarRecusaComMotivo(event)">
                <div class="form-grid">
                    <div class="input-grupo col-total">
                        <label for="input-motivo-recusa">Justificativa (o cliente vai ver essa mensagem)</label>
                        <textarea id="input-motivo-recusa" rows="3" placeholder="Ex: Infelizmente essa data já foi reservada por outra pessoa antes do seu pedido." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-gold btn-bloco">Confirmar recusa</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/frontend/js/global.js"></script>
    <script src="/frontend/js/paginas/reservas-dono.js"></script>
</body>
</html>
