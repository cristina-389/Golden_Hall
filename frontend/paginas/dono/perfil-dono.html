<!--
  GOLDEN HALL - PÁGINA DE PERFIL DO PROPRIETÁRIO (paginas/dono/perfil-dono.html)
  Card "Dados Pessoais" é praticamente idêntico a paginas/cliente/perfil.html
  (mesmas classes de CSS em css/paginas/perfil.css, mesma lógica de edição/
  foto/senha) - o segundo card é diferente: em vez de "Sobre Você" (que não
  fazia sentido pro proprietário - "Preferência de Aluguel" é coisa de quem
  aluga, não de quem anuncia), aqui é "Meus Espaços", com a lista de verdade
  dos espaços cadastrados (GET /api/meus-espacos). Foto de perfil (PUT
  /api/perfil/foto) e troca de senha (PUT /api/perfil/senha) continuam de
  verdade, ligadas no banco.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hall | Meu Perfil</title>

    <link rel="stylesheet" href="/frontend/css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="logado-layout dark perfil-logado-premium">

    <main>
        <section class="secao-perfil">
            <div class="perfil-header">
                <div class="avatar-container">
                    <!-- Sem foto salva ainda: mostra o ícone genérico. Assim que a
                         pessoa escolhe uma foto (input escondido abaixo), ela é lida
                         em base64 e vira essa <img>, salva de verdade em
                         PUT /api/perfil/foto - ver trocarFoto()/preencherPerfil() em
                         js/paginas/perfil-dono.js -->
                    <div class="avatar-circulo">
                        <i class="bi bi-person-fill avatar-icone-generico" id="perfil-avatar-icone"></i>
                        <!-- Clicar na foto (não no ícone genérico) abre ela ampliada -
                             ver abrirVisualizacaoFoto() em js/paginas/perfil-dono.js -->
                        <img class="avatar-foto" id="perfil-avatar-foto" alt="Foto de perfil" style="display: none;" onclick="abrirVisualizacaoFoto()" title="Ver foto ampliada">
                    </div>

                    <button class="btn-trocar-foto" type="button" onclick="abrirModalFoto()" title="Trocar foto">
                        <i class="bi bi-camera-fill"></i>
                    </button>
                    <input type="file" id="perfil-input-foto" accept="image/*" style="display: none;" onchange="trocarFoto(event)">
                </div>
                <h2 class="perfil-nome" id="perfil-nome-cabecalho">Carregando...</h2>
                <span class="status-badge" id="perfil-status-badge">-</span>
            </div>

            <div class="perfil-grid">
                <div class="perfil-card">
                    <h3><i class="bi bi-person-fill"></i> Dados Pessoais</h3>
                    <div class="campo-grupo">
                        <label>Nome Completo</label>
                        <input type="text" id="perfil-input-nome" readonly>
                    </div>
                    <div class="campo-grupo">
                        <label>E-mail</label>
                        <input type="email" id="perfil-input-email" readonly>
                    </div>
                    <div class="campo-grupo">
                        <label>WhatsApp</label>
                        <input type="text" id="perfil-input-telefone" readonly>
                    </div>
                    <div class="campo-grupo">
                        <label>Cidade</label>
                        <input type="text" id="perfil-input-cidade" placeholder="Ex: Americana" readonly>
                    </div>
                    <!-- Só aparece durante a edição (junto com os campos liberados) -
                         ver alternarEdicaoPerfil() em js/paginas/perfil-dono.js -->
                    <button class="link-trocar-senha" id="btn-abrir-trocar-senha" onclick="abrirModalTrocarSenha()" style="display: none;">
                        <i class="bi bi-lock-fill"></i> Alterar senha
                    </button>

                    <button class="btn-ajuste" id="btn-editar-dados" onclick="alternarEdicaoPerfil()">Editar Dados</button>
                </div>

                <div class="perfil-card">
                    <h3><i class="bi bi-shop"></i> Meus Espaços</h3>

                    <!-- Lista de verdade (GET /api/meus-espacos, a mesma rota que o
                         painel usa) - não é um resumo/bio genérico, é o espaço
                         cadastrado de fato - ver carregarMeusEspacos() em
                         js/paginas/perfil-dono.js -->
                    <div id="perfil-lista-espacos" class="perfil-lista-espacos"></div>

                    <a href="/frontend/paginas/dono/painel-dono.html" class="btn-ajuste">Gerenciar Espaços</a>
                </div>
            </div>

            <div class="perfil-actions">
                <button class="btn-sair-perfil" onclick="confirmarSaida()">
                    <i class="bi bi-box-arrow-right"></i> Sair da Conta
                </button>
            </div>
        </section>
    </main>

    <!-- Modal de "ver foto ampliada" - abre ao clicar na própria foto do
         avatar (não no botão de câmera). Só mostra a imagem grande, sem
         nenhuma ação - ver abrirVisualizacaoFoto() em js/paginas/perfil-dono.js -->
    <div id="modal-ver-foto" class="modal-overlay">
        <div class="visualizacao-foto-container">
            <button class="fechar-modal" onclick="fecharVisualizacaoFoto()">&times;</button>
            <img id="imagem-visualizacao-foto" src="" alt="Foto de perfil ampliada">
        </div>
    </div>

    <!-- Modal aberto pelo botão de câmera do avatar - pergunta se a pessoa
         quer escolher uma foto da galeria, tirar uma foto na hora, ou
         remover a foto atual (essa última opção só aparece se já tiver
         uma foto salva - ver abrirModalFoto() em js/paginas/perfil-dono.js) -->
    <div id="modal-foto-perfil" class="modal-overlay">
        <div class="modal-box">
            <button class="fechar-modal" onclick="fecharModalFoto()">&times;</button>

            <h2>Foto de Perfil</h2>
            <div class="linha-dourada-form"></div>
            <p class="subtitulo-form">O que você quer fazer?</p>

            <div class="opcoes-foto-perfil">
                <button type="button" class="opcao-foto-perfil" onclick="escolherOrigemFoto('galeria')">
                    <i class="bi bi-images"></i>
                    <span>Escolher da Galeria</span>
                </button>
                <button type="button" class="opcao-foto-perfil" onclick="escolherOrigemFoto('camera')">
                    <i class="bi bi-camera-fill"></i>
                    <span>Tirar uma Foto</span>
                </button>
                <button type="button" class="opcao-foto-perfil opcao-foto-remover" id="btn-opcao-remover-foto" onclick="escolherOrigemFoto('remover')" style="display: none;">
                    <i class="bi bi-trash"></i>
                    <span>Remover Foto Atual</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal da câmera de verdade (getUserMedia) - aberto pela opção
         "Tirar uma Foto" do modal acima. Fica escondido até a pessoa clicar
         em "Capturar", que desenha o frame atual do vídeo num canvas - ver
         abrirModalCamera()/capturarFotoCamera() em js/paginas/perfil-dono.js -->
    <div id="modal-camera-foto" class="modal-overlay">
        <div class="modal-box">
            <button class="fechar-modal" onclick="fecharModalCamera()">&times;</button>

            <h2>Tirar uma Foto</h2>
            <div class="linha-dourada-form"></div>

            <div class="camera-preview-container">
                <video id="video-camera-foto" autoplay playsinline muted></video>
            </div>

            <button type="button" class="btn btn-gold btn-bloco" onclick="capturarFotoCamera()">
                <i class="bi bi-camera-fill"></i> Capturar
            </button>
        </div>
    </div>

    <!-- Modal de trocar senha - aberto a partir do link "Alterar senha" que
         aparece dentro do card "Dados Pessoais" durante a edição. Fica
         direto aqui (em vez de ser buscado via fetch, como os modais
         globais de js/modais.js) porque só é usado nesta página. -->
    <div id="modal-trocar-senha" class="modal-overlay">
        <div class="modal-box">
            <button class="fechar-modal" onclick="fecharModalTrocarSenha()">&times;</button>

            <h2>Alterar Senha</h2>
            <div class="linha-dourada-form"></div>
            <p class="subtitulo-form">Confirme sua senha atual para definir uma nova.</p>

            <form id="form-trocar-senha" class="form-grid" onsubmit="return alterarSenha(event)">
                <div class="input-grupo col-total">
                    <label for="perfil-senha-atual">Senha Atual</label>
                    <div class="campo-senha">
                        <input type="password" id="perfil-senha-atual" autocomplete="current-password" required>
                        <button type="button" class="btn-mostrar-senha" onclick="alternarVisibilidadeSenha('perfil-senha-atual', this)" title="Mostrar senha">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="input-grupo col-total">
                    <label for="perfil-senha-nova">Nova Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="perfil-senha-nova" minlength="6" autocomplete="new-password" required>
                        <button type="button" class="btn-mostrar-senha" onclick="alternarVisibilidadeSenha('perfil-senha-nova', this)" title="Mostrar senha">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <small class="dica-campo">Mínimo de 6 caracteres</small>
                </div>
                <div class="input-grupo col-total">
                    <label for="perfil-senha-confirmar">Confirmar Nova Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="perfil-senha-confirmar" autocomplete="new-password" required>
                        <button type="button" class="btn-mostrar-senha" onclick="alternarVisibilidadeSenha('perfil-senha-confirmar', this)" title="Mostrar senha">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold btn-bloco">Alterar Senha</button>
            </form>
        </div>
    </div>

    <nav class="barra-navegacao-inferior">
        <a href="/frontend/paginas/dono/index-logado-dono.html" class="item-nav">
            <i class="bi bi-house-door-fill icone"></i>
            <span class="texto">Início</span>
        </a>
        <a href="/frontend/paginas/dono/painel-dono.html" class="item-nav">
            <i class="bi bi-shop icone"></i>
            <span class="texto">Meus Espaços</span>
        </a>
        <a href="/frontend/paginas/dono/perfil-dono.html" class="item-nav ativo">
            <i class="bi bi-person-fill icone"></i>
            <span class="texto">Perfil</span>
        </a>
    </nav>

    <script src="/frontend/js/global.js"></script>
    <script src="/frontend/js/paginas/perfil-dono.js"></script>

</body>
</html>
